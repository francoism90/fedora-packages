name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  specs:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git make rpm-build rpmlint rpmdevtools

      - uses: actions/checkout@v7

      - name: rpmlint
        run: rpmlint packages/*/*.spec

      - name: Build SRPMs
        run: |
          for spec in packages/*/*.spec; do
            make -f .copr/Makefile srpm spec="$spec" outdir=srpms
          done

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: editorconfig-checker
        run: pipx run editorconfig-checker
